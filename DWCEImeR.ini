customer=744349700
top_padding=0
bottom_padding=0
penkind=0
moveable=0
;; 是否点在空白地方可以移动，部分皮肤本身设置有移动区，和本设置无关
autoshift=1
enableuser=0
usdbpath=\SDMMC
inputbox=0
hskin=Spanish_800x190_H_26
hwexclusion=
hwrange=40455
;; 40455 = 0x9E07

;; 强制全屏手写
enableFS=0
;; 手写时自动上屏
hwAutoSend=0
;; 手写超时时间
hwTimeout=800

fcolor=16777215
;; 手写结果字体颜色

scolor=0
;; 手写线条颜色

compfzise=24
;; 输入栏字体大小

candcolor1=16777215
candcolor2=33023
;; 拼音、笔画、等候选窗口内字体颜色，1是正常颜色，2是高亮颜色

compFont=宋体
cFontName=Dotum
;;cFontName=宋体
cCharset=0

