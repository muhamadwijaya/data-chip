;; HALIGN_CENTER 1
;; HALIGN_RIGHT	 2


keymap=48>0|49>1|50>2|51>3|52>4|53>5|54>6|55>7|56>8|57>9
;; 例如 48>0意思为，键值为48的按键映射为0键，多个映射用|分割，注意中间不要出现空格。
;; 支持以下键值： 0-9, a-z, #, *, left, right, up, down, enter, back, space, ok

;;;===================================================
;; 设置说明：
;;;===================================================
;; usdbpath 用户造词保存目录
;; enableuser 开启用户造词功能
;; hwrange 手写识别范围
;; autoshift 在shift状态下，是否自动松开
;; penkind=1  毛笔效果，0铅笔效果
;; top_padding 上偏移
;; bottom_padding 下偏移
;; moveable 可以移动面板
;; hwexclusion 手写排除不显示的结果，不能超过250个汉字
;; inputbox 开启这个功能，可以在另外显示一个窗口显示已输入的内容，可以解决编辑框被输入法档住的问题
;; defmode 默认输入模式